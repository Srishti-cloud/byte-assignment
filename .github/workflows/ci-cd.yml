name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run unit and integration tests
        working-directory: backend
        run: npm test

      - name: Dependency vulnerability scan
        working-directory: backend
        run: npm audit --audit-level=moderate

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-frontend:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying backend and frontend to staging"
          echo "This step should run docker-compose or kubectl/ecs deploy commands in a real environment"

  production-approval:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Production deploy approval gate
        run: echo "Manual approval required before production deployment"

  notify:
    needs: [test, build-and-push, deploy-staging, production-approval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            echo "Pipeline failed. Use Slack/email integration here."
          else
            echo "Pipeline succeeded."
          fi
