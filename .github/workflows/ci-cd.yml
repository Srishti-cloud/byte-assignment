name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run unit and integration tests
        working-directory: backend
        run: npm test

      - name: Dependency vulnerability scan
        working-directory: backend
        run: npm audit --audit-level=moderate

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-backend:${{ github.sha }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-frontend:${{ github.sha }}

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/byte-assignment-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy commit images through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=byte-assignment-staging-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running staging instance found. Run terraform apply first."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=sudo /usr/local/bin/deploy-app $IMAGE_TAG; curl --fail http://localhost/health" \
            --query 'Command.CommandId' --output text)

          for attempt in {1..30}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text; exit 1 ;;
            esac
            sleep 10
          done


  production-approval:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://byte-assignment-alb-609040057.us-east-1.elb.amazonaws.com
    steps:
      - name: Production deploy approval gate
        run: echo "Manual approval required before production deployment"

  deploy-production:
    needs: production-approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy commit images through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=byte-assignment-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running production instance found. Check the Terraform deployment."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=sudo /usr/local/bin/deploy-app $IMAGE_TAG" \
            --query 'Command.CommandId' --output text)

          for attempt in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) \
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM deployment did not finish within the expected time"
          exit 1

  notify:
    needs: [test, build-and-push, deploy-staging, production-approval, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            echo "Pipeline failed. Use Slack/email integration here."
          else
            echo "Pipeline succeeded."
          fi
