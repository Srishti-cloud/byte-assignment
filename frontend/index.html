<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Dashboard</title>
    <meta name="description" content="Simple internal dashboard for assignment demo" />
    <script type="module" src="/src/main.js"></script>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #e2e8f0;
        --text: #172033;
        --muted: #5a667b;
        --primary: #1d4ed8;
        --primary-soft: #dbeafe;
        --success: #0f9f6e;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        padding: 32px 16px;
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 28px;
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0;
        font-size: 1.8rem;
      }

      .status-badge {
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid #bfd8ff;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: bold;
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
      }

      .card {
        padding: 24px;
      }

      .card h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.92rem;
        color: var(--muted);
      }

      input, textarea, select, button {
        font: inherit;
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 12px;
        background: #fff;
        color: var(--text);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.96;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      .item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        background: #fbfdff;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .tag {
        display: inline-block;
        background: #ecfdf5;
        color: var(--success);
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.72rem;
        font-weight: bold;
      }

      .muted {
        color: var(--muted);
      }

      .empty {
        color: var(--muted);
        padding: 12px 0;
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header panel">
        <h1>Assignment Dashboard</h1>
        <span class="status-badge">Local Demo</span>
      </header>

      <main class="content">
        <section class="panel card">
          <h2>Add record</h2>
          <form id="item-form" class="form-grid">
            <div class="field">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Enter task title" required />
            </div>

            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" placeholder="Describe the work here" required></textarea>
            </div>

            <div class="field">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="new">New</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>

            <button type="submit">Save record</button>
          </form>
        </section>

        <section class="panel card">
          <h2>Records</h2>
          <ul id="items-list" class="list"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
